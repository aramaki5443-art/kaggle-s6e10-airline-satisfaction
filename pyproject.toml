[project]
name = "predicting-airline-satisfaction"
version = "0.1.0"
description = "Kaggle Playground Series S6E10「Predicting Airline Satisfaction」の分析リポジトリ"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "catboost>=1.2.10",
    "kaggle>=2.2.4",
    "lightgbm>=4.7.0",
    "matplotlib>=3.11.1",
    "numpy>=2.5.2",
    "openpyxl>=3.1.5",
    "optuna>=5.0.0",
    "pandas>=3.0.5",
    "pyarrow>=26.0.1",
    "pytabkit>=1.7.3",
    "python-pptx>=1.0.2",
    "scikit-learn>=1.9.0",
    "seaborn>=0.13.2",
    "shap>=0.52.0",
    "tiktoken>=0.14.0",
    "xgboost>=3.4.1",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
    "nbconvert>=7.17.1",
]
